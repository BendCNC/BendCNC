# Announce the machine as "bendcnc" to DHCP/DNS on every connection (wired and
# Wi-Fi profiles created by the setup wizard) and never let DHCP rename it.
[main]
hostname-mode=none

[connection]
ipv4.dhcp-send-hostname=true
ipv4.dhcp-hostname=bendcnc
ipv6.dhcp-send-hostname=true
ipv6.dhcp-hostname=bendcnc
