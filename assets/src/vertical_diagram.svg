<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="644" viewBox="0 0 1080 644" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <!-- Source for assets/vertical_diagram.png (render at 2x: tools/render-vertical-diagram.ps1). -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94A3B8" stroke-width="2"/>
    </pattern>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
  </defs>

  <rect width="1080" height="644" fill="#F8FAFC"/>

  <!-- Machine: ram with punch, table with die -->
  <rect x="200" y="0" width="400" height="30" fill="#334155"/>
  <path d="M370,30 L430,30 L400,40 Z" fill="#334155"/>
  <text x="400" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="2">RAM / PUNCH</text>
  <rect x="200" y="604" width="400" height="40" fill="url(#hatch)" stroke="#334155" stroke-width="2"/>
  <path d="M360,604 L400,616 L440,604" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="400" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="2">TABLE / DIE</text>

  <!-- Left scale -->
  <text x="150" y="45" text-anchor="end" font-size="14" fill="#475569" font-family="Consolas, monospace">0.000"</text>
  <text x="150" y="85" text-anchor="end" font-size="14" fill="#475569" font-family="Consolas, monospace">-0.050"</text>
  <line x1="160" y1="40" x2="196" y2="40" stroke="#94A3B8"/>
  <line x1="160" y1="80" x2="196" y2="80" stroke="#94A3B8"/>

  <!-- Position lines -->
  <g stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="200" y1="40"  x2="610" y2="40"  stroke="#334155" stroke-dasharray="none" stroke-width="2"/>
    <line x1="200" y1="80"  x2="610" y2="80"  stroke="#64748B"/>
    <line x1="200" y1="240" x2="610" y2="240" stroke="#16A34A"/>
    <line x1="200" y1="300" x2="610" y2="300" stroke="#64748B"/>
    <line x1="200" y1="380" x2="610" y2="380" stroke="#2563EB"/>
    <line x1="200" y1="460" x2="610" y2="460" stroke="#2563EB"/>
  </g>
  <!-- Material -->
  <rect x="200" y="334" width="400" height="12" fill="#CBD5E1" stroke="#334155" stroke-width="1.5"/>

  <!-- Position labels -->
  <g font-size="15" font-weight="600" fill="#0F172A">
    <text x="622" y="45">Machine Hard Stop</text>
    <text x="622" y="85">Home Position</text>
    <text x="622" y="245">Retract After Bend</text>
    <text x="622" y="305">Start Safety Clearance</text>
    <text x="622" y="345">Material Top</text>
    <text x="622" y="385">Bend Clamp Position</text>
    <text x="622" y="465">Final Bend Position</text>
  </g>
  <path d="M736,85 l9,-8 l9,8 v9 h-18 z" fill="none" stroke="#0F172A" stroke-width="1.8" transform="translate(4,-4)"/>

  <!-- Motion arrows -->
  <g stroke-width="3" fill="none">
    <line x1="230" y1="84" x2="230" y2="294" stroke="#DC2626" marker-end="url(#aRed)"/>
    <line x1="290" y1="304" x2="290" y2="374" stroke="#2563EB" marker-end="url(#aBlue)"/>
    <line x1="350" y1="384" x2="350" y2="454" stroke="#2563EB" marker-end="url(#aBlue)"/>
    <line x1="470" y1="456" x2="470" y2="306" stroke="#16A34A" marker-end="url(#aGreen)"/>
    <line x1="530" y1="296" x2="530" y2="246" stroke="#16A34A" stroke-dasharray="6 4" marker-end="url(#aGreen)"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="244" y="180" fill="#DC2626">1  APPROACH</text>
    <text x="244" y="198" fill="#DC2626" font-weight="400">Palm switches</text>
    <text x="302" y="370" fill="#2563EB" font-size="12">2  CLAMP · Foot pedal</text>
    <text x="364" y="420" fill="#2563EB">3  BEND</text>
    <text x="364" y="437" fill="#2563EB" font-weight="400">Foot pedal</text>
    <text x="482" y="420" fill="#16A34A">4  RETRACT</text>
    <text x="482" y="437" fill="#16A34A" font-weight="400">Automatic</text>
    <text x="400" y="270" fill="#16A34A" font-weight="400" font-size="12">Optional extra</text>
    <text x="400" y="285" fill="#16A34A" font-weight="400" font-size="12">retract</text>
  </g>

  <!-- Dimensions -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <path d="M170,300 V340 M162,300 H178 M162,340 H178"/>
    <path d="M850,380 V460 M842,380 H858 M842,460 H858"/>
    <path d="M950,40 V604 M940,40 H960 M940,604 H960"/>
    <path d="M1040,40 V500 M1030,40 H1050 M1030,500 H1050"/>
  </g>
  <g font-size="13" font-weight="600" fill="#334155">
    <text x="160" y="316" text-anchor="end">Punch-to-Material</text>
    <text x="160" y="332" text-anchor="end">Clearance</text>
    <text x="864" y="417">Total Bend</text>
    <text x="864" y="433">Stroke</text>
    <text transform="translate(940,322) rotate(-90)" text-anchor="middle">Ram-to-Table Opening</text>
    <text transform="translate(1030,270) rotate(-90)" text-anchor="middle">Max Machine Travel (4.000")</text>
  </g>
</svg>
